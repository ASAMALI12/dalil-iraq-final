name: Build Android APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm install --no-audit --no-fund
      - run: npx cap add android
      - name: Icon
        run: |
          if [ -f assets/icon.png ]; then npx capacitor-assets generate --android; fi
      - name: Permissions
        run: |
          if [ -f android-permissions.txt ]; then
            while read -r p; do
              [ -z "$p" ] && continue
              sed -i "s#<application#<uses-permission android:name=\"$p\" />\n    <application#" android/app/src/main/AndroidManifest.xml
            done < android-permissions.txt
          fi
      - run: npx cap sync android
      - run: cd android && chmod +x gradlew && ./gradlew assembleDebug --no-daemon
      - name: Publish APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --cleanup-tag -y || true
          gh release create latest android/app/build/outputs/apk/debug/app-debug.apk --title "APK" --notes "Debug build ${{ github.sha }}"
