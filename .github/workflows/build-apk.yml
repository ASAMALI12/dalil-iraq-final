name: Build Dalil Iraq APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Find project
        run: |
          echo "Repository contents:"
          ls -la
          echo "Searching for package.json:"
          find . -maxdepth 3 -name package.json -print

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        working-directory: ./dalil-shatra-main
        run: npm install

      - name: Build web app
        working-directory: ./dalil-shatra-main
        run: npm run build

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Sync Capacitor
        working-directory: ./dalil-shatra-main
        run: npx cap sync android

      - name: Build APK
        working-directory: ./dalil-shatra-main/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Dalil-Iraq-APK
          path: ./dalil-shatra-main/android/app/build/outputs/apk/debug/app-debug.apk
